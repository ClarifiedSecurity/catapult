autocomplete:
  function_name: ctp
  commands:
    - command: host
      description: Commands for configuring hosts
      hosts_as_arguments: true
      subcommands:
        # Default deploy modes
        - subcommand_name: deploy
          subcommand_description: Deploys the VM with the given inventory_hostname from start to end
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -l "$@"

        - subcommand_name: redeploy
          subcommand_description: Destroys the existing VM and runs the ctp deploy command
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -l "$@"

        - subcommand_name: remove
          subcommand_description: Destroys the existing VM
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=undeploy -l "$@"

        # Deploy-to advanced deploy modes

        # To commands

        - subcommand_name: deploy-to-clone
          subcommand_description: Runs ctp deploy and stops once the VM is cloned and the network is configured
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_create=true -l "$@"

        - subcommand_name: redeploy-to-clone
          subcommand_description: Destroys the existing VM and runs the ctp deploy-to-clone command
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e dm_create=true -l "$@"

        - subcommand_name: deploy-to-base
          subcommand_description: Runs ctp deploy, stops and creates a snapshot
            once the base configuration (users, hostnames, etc) are applied
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_base=true -l "$@"

        - subcommand_name: redeploy-to-base
          subcommand_description: Destroys the existing VM and runs the ctp redeploy-to-base command
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e dm_base=true -l "$@"

        # From commands

        - subcommand_name: deploy-from-clone
          subcommand_description: Starts the play from the cloned VM and runs until the end
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_after_clone=true -l "$@"

        - subcommand_name: deploy-from-base
          subcommand_description: Starts the play after the base configuration is applied and runs until the end
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_after_base=true -l "$@"

        # Misc commands

        - subcommand_name: deploy-with-network
          subcommand_description: Runs ctp deploy and also reconfigures the network settings for non-first deploy
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e reconfigure_network=true -l "$@"

        - subcommand_name: deploy-with-mid-snap
          subcommand_description: Runs ctp deploy but creates a snapshot after the base configuration is applied
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e deploy_with_base_snapshot=true -l "$@"

        - subcommand_name: redeploy-with-mid-snap
          subcommand_description: Destroys the existing VM and runs the ctp redeploy-with-mid-snap command
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=redeploy -e deploy_with_base_snapshot=true -l "$@"

        - subcommand_name: deploy-pre-role
          subcommand_description: Runs only the role defined as the fist tab-completable argument as pre_role and then stops
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e dm_customize=true -e pre_role="$role" -l "$@"

        - subcommand_name: deploy-role
          subcommand_description: Runs only the /srv/<project_name>/vm/<role_name> part of the playbook and then stops
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_customize=true -l "$@"

        - subcommand_name: deploy-single-role
          subcommand_description: Runs only the role defined as the fist tab-completable argument and then stops
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e dm_customize=true -e single_role="$role" -l "$@"

        - subcommand_name: rebuild-linode-vm
          subcommand_description: Rebuilds the existing Linode VM with a new disk but keeps the existing IP
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e rebuild=yes -l "$@"

        - subcommand_name: vars
          subcommand_description: Lists the variables for the given inventory_hostname
          subcommand_to_execute: ansible-inventory $PWD/playbook.yml -e @~/.vault/vlt --vars --host "$@"

        - subcommand_name: list
          subcommand_description: Lists the hosts for the given inventory_hostname, group or matching pattern
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy --list-hosts -l "$@"

        - subcommand_name: update
          subcommand_description: Installs the OS updates for the given inventory_hostname
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e dm_customize=true -e single_role=nova.core.updates -l "$@"

        - subcommand_name: ip
          subcommand_description: Get the IP of the given inventory_hostname
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e pre_role=nova.core.get_ip -e deploy_vars_get_vault_token=false -l "$@"

        - subcommand_name: connect
          subcommand_description: Connecting the given inventory_hostname over SSH
          subcommand_to_execute: /srv/scripts/general/connect.sh "$@"

        - subcommand_name: console
          subcommand_description: Open Ansible console for the given inventory_hostname
          subcommand_to_execute: ansible-console -e @~/.vault/vlt "$@"

        # LEGACY DEPLOY COMMANDS THAT WILL BE DEPRECATED IN THE FUTURE

        - subcommand_name: deploy-network
          subcommand_description: DEPRECATED - use deploy-with-network instead
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e reconfigure_network=true -l "$@"

        - subcommand_name: deploy-until-configuration
          subcommand_description: DEPRECATED - use deploy-to-base instead
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_base=true -l "$@"

        - subcommand_name: redeploy-until-configuration
          subcommand_description: DEPRECATED - use redeploy-to-base instead
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e dm_base=true -l "$@"

        - subcommand_name: deploy-from-configuration
          subcommand_description: DEPRECATED - use deploy-from-base instead
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_after_base=true -l "$@"

    - command: retry
      description: Commands for retrying failed machines
      hosts_as_arguments: false
      subcommands:
        - subcommand_name: list
          subcommand_description: List the current hosts in this session's playbook.retry file
          subcommand_to_execute:
            cat "${CTP_SESSION_RETRY_FILE#@}" 2> /dev/null ||
            echo "No hosts found in ${CTP_SESSION_RETRY_FILE#@}"

        - subcommand_name: deploy
          subcommand_description: Run deploy on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: redeploy
          subcommand_description: Run redeploy on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-with-network
          subcommand_description: Run deploy-with-network on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e reconfigure_network=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-to-clone
          subcommand_description: Run deploy-to-clone on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_create=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: redeploy-to-clone
          subcommand_description: Run redeploy-to-clone on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e dm_create=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-to-base
          subcommand_description: Run deploy-to-base on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_base=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: redeploy-to-base
          subcommand_description: Run redeploy-to-base on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e dm_base=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-from-clone
          subcommand_description: Run deploy-from-clone on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_after_clone=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-from-base
          subcommand_description: Run deploy-from-base on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_after_base=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-with-mid-snap
          subcommand_description: Run deploy-with-mid-snap on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e deploy_with_base_snapshot=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: redeploy-with-mid-snap
          subcommand_description: Run redeploy-with-mid-snap on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e deploy_with_base_snapshot=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-role
          subcommand_description: Run deploy-role on failed machines based on this session's playbook.retry file
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_customize=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        # LEGACY RETRY COMMANDS THAT WILL BE DEPRECATED IN THE FUTURE

        - subcommand_name: deploy-until-configuration
          subcommand_description: DEPRECATED - use deploy-to-base instead
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_base=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: redeploy-until-configuration
          subcommand_description: DEPRECATED - use redeploy-to-base instead
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=redeploy -e dm_base=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

        - subcommand_name: deploy-from-configuration
          subcommand_description: DEPRECATED - use deploy-from-base instead
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e dm_after_base=true
            -l "$CTP_SESSION_RETRY_FILE" "$@"

    - command: vm
      description: Commands for configuring hosts on an hypervisor level
      hosts_as_arguments: true
      subcommands:
        # Snapshots
        - subcommand_name: snapshot-create
          subcommand_description: Creates a snapshot
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=snap -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: snapshot-create-clean
          subcommand_description: Removes existing snapshots and creates a new one
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=clean-snap -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: snapshot-create-live
          subcommand_description: Creates a running state snapshot
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=snap -e live_snap=true -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: snapshot-revert
          subcommand_description: Reverts to latest snapshot or the one defined as -e snapshot_name=<snapshot_name>
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=revert -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: snapshot-remove
          subcommand_description: Removes snapshot defined as -e snapshot_name=<snapshot_name_to_remove>
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=remove -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: snapshot-remove-all
          subcommand_description: Removes all snapshots
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=remove -e remove_all_snapshots=true -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: snapshot-rename
          subcommand_description: Renames the snapshot defined as -e snapshot_name=<snapshot_name_to_rename> to -e new_snapshot_name=<new_snapshot_name>
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e snapshot_mode=rename -e pre_role=nova.core.snapshots
            -e deploy_vars_get_vault_token=false -l "$@"

        # Powerstate
        - subcommand_name: poweron
          subcommand_description: Powers on the VM
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e poweron=true -e pre_role=nova.core.powerstate
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: restart
          subcommand_description: Restarts the VM
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e restart=true -e pre_role=nova.core.powerstate
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: shutdown
          subcommand_description: Shuts down the VM
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e shutdown=true -e pre_role=nova.core.powerstate
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: poweroff
          subcommand_description: Powers off the VM
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e poweroff=true -e pre_role=nova.core.powerstate
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: reset
          subcommand_description: Resets the VM
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e reset=true -e pre_role=nova.core.powerstate
            -e deploy_vars_get_vault_token=false -l "$@"
        - subcommand_name: suspend
          subcommand_description: Suspends the VM
          subcommand_to_execute:
            ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt
            -e deploy_mode=deploy -e suspend=true -e pre_role=nova.core.powerstate
            -e deploy_vars_get_vault_token=false -l "$@"

        # Miscellaneous
        - subcommand_name: rename
          subcommand_description: Renames the VM with the given inventory_hostname
          subcommand_to_execute: ansible-playbook $PWD/playbook.yml -e @~/.vault/vlt -e deploy_mode=deploy -e pre_role=nova.core.rename_vm -l "$@"

    - command: secrets
      description: Commands for managing your personal secrets
      hosts_as_arguments: false
      subcommands:
        - subcommand_name: unlock
          subcommand_description: Unlocks the Ansible Vault
          subcommand_to_execute: /srv/scripts/general/secrets-unlock.sh
        - subcommand_name: edit
          subcommand_description: Opens the Ansible Vault for editing
          subcommand_to_execute: /srv/scripts/general/secrets-edit.sh
        - subcommand_name: change-password
          subcommand_description: Changes the Ansible Vault password
          subcommand_to_execute: /srv/scripts/general/secrets-change-password.sh

    - command: project
      description: Commands for managing projects
      hosts_as_arguments: false
      subcommands:
        - subcommand_name: select
          subcommand_description: Lists all available projects under /srv/inventories and allows you to select one
          subcommand_to_execute: source /srv/scripts/general/select-inventory.sh
        - subcommand_name: update-inventory
          subcommand_description: Updates the tab-completable inventory for currently selected project
          subcommand_to_execute: source /srv/scripts/general/generate-inventory-completion.sh

    - command: update
      description: Commands for Catapult component updates
      hosts_as_arguments: false
      subcommands:
        - subcommand_name: builtin-collections
          subcommand_description: Re-installs (overwrites) builtin roles and collections
          subcommand_to_execute: /srv/scripts/general/install-collections.sh
        - subcommand_name: nova
          subcommand_description: Checks for nova.core collection updates
          subcommand_to_execute: /srv/scripts/entrypoints/first-run/02-nova-core-version-check.sh
        - subcommand_name: venv
          subcommand_description: Updates Python virtual environment packages
          subcommand_to_execute: /srv/scripts/general/update-venv.sh

    - command: dev
      description: Commands for Catapult developers
      hosts_as_arguments: false
      subcommands:
        - subcommand_name: enable-timing
          subcommand_description: Enables timing for tasks
          subcommand_to_execute: export ANSIBLE_CALLBACKS_ENABLED=ansible.posix.profile_tasks
        - subcommand_name: disable-timing
          subcommand_description: Disables timing for tasks
          subcommand_to_execute: unset ANSIBLE_CALLBACKS_ENABLED && echo 'Timing disabled'
        - subcommand_name: reset-completion
          subcommand_description: Resets tab completion commands and regenerates them
          subcommand_to_execute: rm -f ~/autocomplete.zsh
            && /srv/scripts/general/autocomplete_generator.py
            && . $HOME/autocomplete.zsh
