---
# Template created with Packer or manually
# Used only to create project templates from
base_vm_template: BASE_TEMPLATE_panos

vm_template: catapult-template-panos

# Accounts
admin_account: admin
template_username: "{{ admin_account }}"

# Connection
ansible_connection: ansible.builtin.local

# Network
ansible_network_os: panos # Not natively supported by Ansible but Catapult can use it to determine the correct tasks to run
customization_method: panos
