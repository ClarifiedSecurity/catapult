[defaults]
collections_path = ansible:~/ansible
forks = 300
gathering = explicit
host_key_checking = false
interpreter_python = auto_silent
inventory = inventories/_operating_systems/os.ini,$PWD/inventory
local_tmp=/tmp/.ansible/tmp
pipelining = true
retry_files_enabled = True
retry_files_save_path = $PWD
roles_path = ansible:~/ansible
strategy = ansible.builtin.free
timeout = 60
win_async_startup_timeout = 30

# Callback settings
callback_result_format = yaml
display_skipped_hosts = false

# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/ssh_connection.html#parameters
[ssh_connection]
retries=7

# ServerAliveInterval=10 required for SSH to be stable on older Windows versions
ssh_args =-C -o ControlMaster=auto -o ControlPersist=30m -o ControlPath=/tmp/.ssh-control-path/%C -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=10

[paramiko_connection]
# For connections to RouterOS, Cisco IOS, VyOS etc.
record_host_keys = false

[persistent_connection]
network_cli_retries = 10

[hashi_vault_collection]
timeout = 60
retries = 5
backoff_factor = 3
